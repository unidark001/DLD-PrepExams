<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Digital Logic Design - Comprehensive Circuit Exam</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --sidebar-bg: #111827;
            --card-bg: #1f2937;
            --card-border: #374151;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --success-color: #10b981;
            --error-color: #ef4444;
            --option-bg: #111827;
            --option-hover: #374151;
            --header-bg: #111827;
        }

        [data-theme="light"] {
            --bg-color: #f3f4f6;
            --sidebar-bg: #ffffff;
            --card-bg: #ffffff;
            --card-border: #e5e7eb;
            --text-color: #1f2937;
            --text-muted: #6b7280;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --success-color: #059669;
            --error-color: #dc2626;
            --option-bg: #f9fafb;
            --option-hover: #f3f4f6;
            --header-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .sidebar-header {
            padding: 20px;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modules-list {
            overflow-y: auto;
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .module-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px 15px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .module-card:hover {
            border-color: var(--accent-color);
        }

        .module-card.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: #ffffff;
        }

        .module-card.active .module-status {
            color: rgba(255, 255, 255, 0.8);
        }

        .module-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .module-status {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Main Content */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        /* Header */
        header {
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--card-border);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .badge {
            background-color: var(--accent-color);
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .exam-title {
            font-size: 18px;
            font-weight: bold;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .timer-box {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-family: monospace;
        }

        .theme-toggle {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .theme-toggle:hover {
            background-color: var(--option-hover);
        }

        /* Exam Body (Split View) */
        .exam-body {
            flex-grow: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            gap: 25px;
        }

        /* Left Question Nav / Status Box */
        .question-status-panel {
            width: 240px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: fit-content;
        }

        .q-number-badge {
            background-color: var(--accent-color);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
        }

        .q-state-text {
            font-size: 13px;
            color: var(--text-muted);
        }

        .flag-box {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Right Question Card */
        .question-main-card {
            flex-grow: 1;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .question-text {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* Visual Container for Diagrams/K-Maps/SVG */
        .visual-container {
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: auto;
        }

        .kmap-table {
            border-collapse: collapse;
            text-align: center;
            font-family: monospace;
            font-size: 14px;
        }

        .kmap-table td, .kmap-table th {
            border: 1px solid var(--card-border);
            width: 45px;
            height: 45px;
            padding: 5px;
        }

        .kmap-table th {
            background-color: rgba(59, 130, 246, 0.15);
            color: var(--accent-color);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: var(--option-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 14px 18px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
        }

        .option-btn:hover {
            background-color: var(--option-hover);
            border-color: var(--accent-color);
        }

        .option-btn.selected {
            border-color: var(--accent-color);
            background-color: rgba(59, 130, 246, 0.1);
        }

        .option-btn.correct {
            border-color: var(--success-color);
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--success-color);
        }

        .option-btn.incorrect {
            border-color: var(--error-color);
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--error-color);
        }

        .option-letter {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
            flex-shrink: 0;
        }

        .hint-container {
            display: none;
            margin-top: 15px;
            padding: 12px 16px;
            background-color: rgba(59, 130, 246, 0.1);
            border-left: 4px solid var(--accent-color);
            border-radius: 0 6px 6px 0;
            font-size: 14px;
            color: var(--text-muted);
        }

        /* Footer Navigation */
        .exam-footer {
            background-color: var(--header-bg);
            border-top: 1px solid var(--card-border);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }

        .nav-btn:hover:not(:disabled) {
            background-color: var(--option-hover);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .nav-btn.primary {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: white;
        }

        .nav-btn.primary:hover {
            background-color: var(--accent-hover);
        }

        .progress-indicator {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
        }

        body[data-theme="light"] {
            --bg-color: #f5f5f5;
            --sidebar-bg: #ffffff;
            --card-bg: #ffffff;
            --card-border: #d6dce1;
            --text-color: #212529;
            --text-muted: #5f6b75;
            --accent-color: #0f6cbf;
            --accent-hover: #0b5cad;
            --success-color: #106b45;
            --error-color: #a33442;
            --option-bg: #ffffff;
            --option-hover: #e7f1f8;
            --header-bg: #ffffff;
            --shadow: 0 1px 3px rgba(33, 37, 41, 0.08);
            --bg-soft: #f8fafc;
            --primary-soft: #e7f1f8;
        }

        body[data-theme="dark"] {
            --bg-color: #0b1422;
            --sidebar-bg: #0f1d2d;
            --card-bg: #101d30;
            --card-border: #23344d;
            --text-color: #edf3ff;
            --text-muted: #9aa9bd;
            --accent-color: #3d9bf5;
            --accent-hover: #8bc1ff;
            --success-color: #9ce7bf;
            --error-color: #ffc7d1;
            --option-bg: #132338;
            --option-hover: #1b2c42;
            --header-bg: rgba(11, 20, 34, 0.92);
            --shadow: 0 12px 28px rgba(2, 6, 23, 0.3);
            --bg-soft: #132338;
            --primary-soft: #142d49;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            min-width: 320px;
            min-height: 100vh;
            height: auto;
            overflow: auto;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .site-header {
            position: sticky;
            z-index: 10;
            top: 0;
            width: 100%;
            padding: 14px 24px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--card-border);
            box-shadow: var(--shadow);
            backdrop-filter: blur(8px);
        }

        .site-header-inner {
            width: min(100%, 1440px);
            min-height: 40px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .site-title {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            margin: 0;
            color: var(--text-color);
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .badge {
            flex: 0 0 auto;
            padding: 5px 9px;
            border-radius: 4px;
            background: var(--accent-color);
            color: #ffffff;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
        }

        .header-right {
            gap: 10px;
        }

        .timer-box {
            padding: 7px 11px;
            border-color: var(--card-border);
            background: var(--option-bg);
            color: var(--accent-hover);
            font-size: 12px;
            font-weight: 700;
        }

        .theme-toggle {
            min-height: 36px;
            padding: 7px 13px;
            border-radius: 999px;
            background: var(--option-bg);
            font-size: 12px;
            font-weight: 700;
        }

        .theme-toggle:hover {
            border-color: var(--accent-color);
            transform: translateY(-1px);
        }

        .page-layout {
            display: grid;
            grid-template-columns: 270px minmax(0, 1fr);
            align-items: start;
            gap: 20px;
            width: min(100%, 1472px);
            margin: 24px auto;
            padding: 0 16px;
            transition: grid-template-columns 0.25s ease;
        }

        .page-layout.sidebar-collapsed {
            grid-template-columns: 48px minmax(0, 1fr);
        }

        .sidebar {
            position: sticky;
            top: 88px;
            width: auto;
            min-width: 0;
            height: auto;
            max-height: calc(100vh - 112px);
            background: transparent;
            border: 0;
        }

        .sidebar-header {
            min-height: 36px;
            padding: 0 2px 8px;
            border: 0;
            color: var(--text-muted);
            font-size: 13px;
        }

        .sidebar-toggle {
            display: inline-flex;
            width: 32px;
            height: 32px;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            background: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
            font-size: 19px;
            line-height: 1;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .sidebar-toggle:hover {
            border-color: var(--accent-color);
            background: var(--option-hover);
        }

        .sidebar-toggle svg {
            width: 16px;
            height: 16px;
            transition: transform 0.25s ease;
        }

        .sidebar.collapsed .sidebar-toggle svg {
            transform: rotate(180deg);
        }

        .page-layout.sidebar-collapsed .sidebar-header {
            justify-content: center;
        }

        .sidebar.collapsed .sidebar-title,
        .sidebar.collapsed .modules-list {
            display: none;
        }

        .modules-list {
            max-height: calc(100vh - 154px);
            overflow-y: auto;
            padding: 8px;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            background: var(--sidebar-bg);
            box-shadow: var(--shadow);
            scrollbar-width: thin;
        }

        .module-card {
            display: flex;
            flex-direction: column;
            gap: 9px;
            width: 100%;
            min-height: 78px;
            padding: 12px;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            background: var(--option-bg);
            color: var(--text-color);
            text-align: left;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        .module-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-1px);
        }

        .module-card.active {
            border-color: transparent;
            background: var(--accent-color);
            color: #ffffff;
        }

        .module-title {
            margin: 0;
            font-size: 12px;
            font-weight: 700;
            line-height: 1.4;
        }

        .module-status {
            color: var(--text-muted);
            font-size: 11px;
            line-height: 1.3;
        }

        .module-card.active .module-status {
            color: rgba(255, 255, 255, 0.88);
        }

        .module-progress-track {
            display: block;
            width: 100%;
            height: 5px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.2);
        }

        .module-progress-fill {
            display: block;
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: var(--accent-color);
            transition: width 0.35s ease;
        }

        .module-card.active .module-progress-track {
            background: rgba(255, 255, 255, 0.3);
        }

        .module-card.active .module-progress-fill {
            background: #ffffff;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            min-width: 0;
            height: auto;
            overflow: visible;
        }

        .exam-body {
            display: block;
            flex: initial;
            overflow: visible;
            padding: 0;
        }

        .question-shell {
            display: grid;
            grid-template-columns: 190px minmax(0, 1fr);
            overflow: hidden;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            background: var(--card-bg);
            box-shadow: var(--shadow);
        }

        .question-status-panel {
            width: auto;
            height: auto;
            padding: 16px;
            gap: 0;
            border: 0;
            border-right: 1px solid var(--card-border);
            border-radius: 0;
            background: var(--bg-soft, #f8fafc);
        }

        .q-number-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 34px;
            padding: 7px 10px;
            border-radius: 6px;
            background: var(--primary-soft, #e7f1f8);
            color: var(--accent-hover);
            font-size: 12px;
            letter-spacing: 0.02em;
        }

        .q-state-text {
            margin-top: 12px;
            color: var(--text-muted);
            font-size: 12px;
            line-height: 1.6;
        }

        .q-state-text::first-line {
            color: var(--text-color);
        }

        .flag-box {
            width: 100%;
            margin-top: 12px;
            padding: 8px;
            border: 1px solid var(--card-border);
            border-radius: 7px;
            color: var(--text-color);
            font-size: 12px;
        }

        .flag-box input {
            accent-color: var(--accent-color);
        }

        .question-main-card {
            min-width: 0;
            min-height: 320px;
            padding: 20px;
            border: 0;
            border-radius: 0;
            background: var(--card-bg);
        }

        .question-text {
            margin: 0 0 16px;
            color: var(--text-color);
            font-size: 16px;
            font-weight: 600;
            line-height: 1.6;
        }

        .visual-container {
            border-color: var(--card-border);
            background: var(--bg-color);
        }

        .options-container {
            gap: 10px;
            margin-bottom: 16px;
        }

        .option-btn {
            width: 100%;
            min-height: 50px;
            padding: 10px 12px;
            border-radius: 6px;
            background: var(--option-bg);
            color: var(--text-color);
            font: inherit;
            text-align: left;
            line-height: 1.5;
            box-shadow: none;
        }

        .option-btn:hover:not(:disabled) {
            background: var(--option-hover);
            border-color: var(--accent-color);
        }

        .option-btn.correct {
            border-color: #6ec59b;
            background: #ebf9f1;
            color: #106b45;
        }

        .option-btn.incorrect {
            border-color: #ef9ca4;
            background: #fff1f2;
            color: #a33442;
        }

        body[data-theme="dark"] .option-btn.correct {
            border-color: #2d9a6a;
            background: #102e22;
            color: #9ce7bf;
        }

        body[data-theme="dark"] .option-btn.incorrect {
            border-color: #d65d77;
            background: #301b2a;
            color: #ffc7d1;
        }

        .option-letter {
            width: 26px;
            height: 26px;
            background: rgba(148, 163, 184, 0.1);
            color: var(--text-muted);
        }

        .hint-container {
            border-left-color: var(--accent-color);
            background: var(--option-hover);
            color: var(--text-color);
            line-height: 1.6;
        }

        .exam-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
            padding: 16px;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            background: var(--card-bg);
            box-shadow: var(--shadow);
        }

        .nav-btn {
            min-height: 44px;
            padding: 10px 18px;
            border-radius: 6px;
            font: inherit;
            font-size: 13px;
        }

        .nav-btn:not(.primary) {
            background: var(--option-hover);
        }

        .nav-btn.primary {
            background: var(--accent-color);
        }

        .nav-btn.primary:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        .progress-indicator {
            color: var(--text-color);
            font-size: 13px;
        }

        .site-footer {
            margin-top: auto;
            padding: 16px;
            border-top: 1px solid var(--card-border);
            color: var(--text-muted);
            text-align: center;
            font-size: 12px;
        }

        button:focus-visible,
        input:focus-visible {
            outline: 3px solid rgba(15, 108, 191, 0.4);
            outline-offset: 2px;
        }

        @media (max-width: 760px) {
            .site-header {
                padding: 12px 16px;
            }

            .site-header-inner {
                flex-wrap: wrap;
                gap: 10px;
            }

            .site-title {
                font-size: 15px;
            }

            .page-layout,
            .page-layout.sidebar-collapsed {
                grid-template-columns: minmax(0, 1fr);
                gap: 14px;
                margin: 16px auto;
            }

            .sidebar {
                position: static;
                max-height: none;
            }

            .modules-list {
                display: flex;
                max-height: 220px;
                flex-direction: column;
            }

            .sidebar.collapsed .modules-list {
                display: none;
            }

            .question-shell {
                grid-template-columns: minmax(0, 1fr);
            }

            .question-status-panel {
                display: grid;
                grid-template-columns: minmax(110px, 0.7fr) minmax(0, 1fr) auto;
                align-items: center;
                gap: 12px;
                border-right: 0;
                border-bottom: 1px solid var(--card-border);
            }

            .q-state-text,
            .flag-box {
                margin-top: 0;
            }

            .flag-box {
                width: auto;
            }

            .question-main-card {
                min-height: 0;
                padding: 16px;
            }
        }

        @media (max-width: 480px) {
            .header-right {
                width: 100%;

                padding: 12px;
            }

                padding: 9px 12px;
            }

            scrollbar-color: var(--scrollbar-thumb, #aab5bf) var(--scrollbar-track, #e8edf2);
        }

        .modules-list::-webkit-scrollbar {
            width: 10px;
        }

        .modules-list::-webkit-scrollbar-track {
            border-radius: 999px;
            background: var(--scrollbar-track, #e8edf2);
        }

        .modules-list::-webkit-scrollbar-thumb {
            border: 2px solid var(--scrollbar-track, #e8edf2);
            border-radius: 999px;
            background: var(--scrollbar-thumb, #aab5bf);
        }

        body[data-theme="dark"] {
            --scrollbar-track: #101d30;
            --scrollbar-thumb: #38536e;
        }

        body[data-theme="light"] {
            --scrollbar-track: #e8edf2;
            --scrollbar-thumb: #aab5bf;
        }

        .visual-container svg {
            display: block;
            max-width: 100%;
            height: auto;
        }

        .question-shell.question-enter-next {
            animation: question-enter-next 240ms ease-out both;
        }

        .question-shell.question-enter-previous {
            animation: question-enter-previous 240ms ease-out both;
        }

        .question-shell.question-enter-module {
            animation: question-enter-module 280ms ease-out both;
        }

        .question-shell.question-enter-answer {
            animation: question-enter-answer 180ms ease-out both;
        }

        @keyframes question-enter-next {
            from { opacity: 0.5; transform: translateX(18px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes question-enter-previous {
            from { opacity: 0.5; transform: translateX(-18px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes question-enter-module {
            from { opacity: 0.5; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes question-enter-answer {
            from { opacity: 0.7; }
            to { opacity: 1; }
        }

        .option-btn.correct.answer-reveal {
            animation: answer-correct 380ms ease-out both;
        }

        .option-btn.incorrect.answer-reveal {
            animation: answer-incorrect 380ms ease-out both;
        }

        @keyframes answer-correct {
            0% { transform: scale(0.985); }
            65% { transform: scale(1.015); }
            100% { transform: scale(1); }
        }

        @keyframes answer-incorrect {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            50% { transform: translateX(4px); }
            75% { transform: translateX(-2px); }
        }

        .option-btn:disabled {
            cursor: default;
        }

        .option-btn.correct .option-letter,
        .option-btn.incorrect .option-letter {
            width: 26px;
            height: 26px;
            border-color: transparent;
            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
        }

        .option-btn.correct .option-letter {
            background: #259b71;
        }

        .option-btn.incorrect .option-letter {
            background: #d94f68;
        }

        .hint-container strong {
            display: block;
            margin-bottom: 6px;
            color: var(--accent-hover);
            font-size: 12px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .hint-container p {
            margin: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>

        let currentModule = 0;
        let currentQuestion = 0;
        let userAnswers = new Map();
        let flaggedQuestions = new Set();
        let secondsElapsed = 0;
        let timerInterval;

        function shuffleArray(items) {
            for (let index = items.length - 1; index > 0; index--) {
                const swapIndex = Math.floor(Math.random() * (index + 1));
                [items[index], items[swapIndex]] = [items[swapIndex], items[index]];
            }
        }

        function randomizeModule(moduleData) {
            shuffleArray(moduleData.questions);
            moduleData.questions.forEach(qData => {
                if (!qData.choices) {
                    qData.choices = qData.options.map((text, index) => ({
                        text,
                        isCorrect: index === qData.correct
                    }));
                }
                shuffleArray(qData.choices);
                qData.correct = qData.choices.findIndex(choice => choice.isCorrect);
            });
        }

        function animateQuestion(direction) {
            const questionShell = document.querySelector('.question-shell');
            questionShell.classList.remove(
                'question-enter-next',
                'question-enter-previous',
                'question-enter-module',
                'question-enter-answer'
            );
            void questionShell.offsetWidth;
            questionShell.classList.add(`question-enter-${direction}`);
        }

        // Initialize App
        function init() {
            const sidebar = document.getElementById('module-sidebar');
            const layout = document.getElementById('page-layout');
            const sidebarToggle = document.getElementById('sidebar-toggle');
            sidebarToggle.addEventListener('click', () => {
                const isCollapsed = sidebar.classList.toggle('collapsed');
                layout.classList.toggle('sidebar-collapsed', isCollapsed);
                sidebarToggle.setAttribute('aria-expanded', String(!isCollapsed));
                sidebarToggle.setAttribute('aria-label', `${isCollapsed ? 'Expand' : 'Collapse'} module list`);
                sidebarToggle.title = `${isCollapsed ? 'Expand' : 'Collapse'} module list`;
            });
            randomizeModule(quizData[currentModule]);
            renderModulesList();
            loadQuestion(0, 0, 'module');
            startTimer();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                secondsElapsed++;
                let mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
                let secs = (secondsElapsed % 60).toString().padStart(2, '0');
                document.getElementById('timer').innerText = `Time: ${mins}:${secs}`;
            }, 1000);
        }

        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', newTheme);
            document.getElementById('theme-icon').innerText = newTheme === 'dark' ? '🌙' : '☀️';
            document.getElementById('theme-text').innerText = newTheme === 'dark' ? 'Dark' : 'Light';
            document.getElementById('theme-toggle').setAttribute('aria-label', `Switch to ${newTheme === 'dark' ? 'light' : 'dark'} theme`);
        }

        function renderModulesList() {
            const container = document.getElementById('modules-list');
            container.innerHTML = '';
            let totalAnsweredCount = 0;
            let totalQuestionsCount = 0;

            quizData.forEach((mod, idx) => {
                const answeredCount = mod.questions.filter(qData => userAnswers.has(qData)).length;
                totalAnsweredCount += answeredCount;
                totalQuestionsCount += mod.questions.length;

                const card = document.createElement('button');
                card.type = 'button';
                card.className = `module-card ${idx === currentModule ? 'active' : ''}`;
                card.setAttribute('aria-pressed', String(idx === currentModule));
                card.onclick = () => switchModule(idx);
                card.innerHTML = `
                    <div class="module-title">${mod.title}</div>
                    <div class="module-status">${answeredCount} / ${mod.questions.length} answered</div>
                    <span class="module-progress-track" aria-hidden="true">
                        <span class="module-progress-fill" style="width: ${answeredCount / mod.questions.length * 100}%"></span>
                    </span>
                `;
                container.appendChild(card);
            });

            document.getElementById('overall-progress').innerText = `${totalAnsweredCount} / ${totalQuestionsCount}`;
        }

        function switchModule(modIdx) {
            if (modIdx === currentModule) return;
            enterModule(modIdx, 0, 'module');
        }

        function enterModule(modIdx, qIdx, transition) {
            if (modIdx !== currentModule) {
                randomizeModule(quizData[modIdx]);
            }
            currentModule = modIdx;
            currentQuestion = qIdx;
            renderModulesList();
            loadQuestion(currentModule, currentQuestion, transition);
        }

        function loadQuestion(modIdx, qIdx, transition) {
            currentModule = modIdx;
            currentQuestion = qIdx;
            const qData = quizData[modIdx].questions[qIdx];

            document.getElementById('q-num-badge').innerText = `Question ${qIdx + 1}`;
            document.getElementById('question-text').innerText = qData.q;
            document.getElementById('progress-indicator').innerText = `Question ${qIdx + 1} of ${quizData[modIdx].questions.length}`;

            // Visual container handling
            const visualContainer = document.getElementById('visual-container');
            if (qData.visual) {
                visualContainer.innerHTML = qData.visual;
                visualContainer.style.display = 'flex';
            } else {
                visualContainer.innerHTML = '';
                visualContainer.style.display = 'none';
            }

            // Flag checkbox state
            document.getElementById('flag-checkbox').checked = flaggedQuestions.has(qData);

            // Options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const savedAnswer = userAnswers.get(qData);
            const isAnswered = savedAnswer !== undefined;

            const statusText = document.getElementById('q-status-text');
            const hintBox = document.getElementById('hint-container');

            if (isAnswered) {
                statusText.innerHTML = `Answered<br>Marked ${savedAnswer.isCorrect ? '1.00' : '0.00'} out of 1.00`;
                hintBox.replaceChildren();
                const heading = document.createElement('strong');
                heading.textContent = 'Rationale & Explanation';
                const explanation = document.createElement('p');
                explanation.textContent = `Your answer is ${savedAnswer.isCorrect ? 'correct' : 'incorrect'}. Correct answer: ${qData.choices[qData.correct].text}. ${qData.rationale || qData.hint}`;
                hintBox.append(heading, explanation);
                hintBox.style.display = 'block';
            } else {
                statusText.innerHTML = `Not yet answered<br>Marked 0.00 out of 1.00`;
                hintBox.style.display = 'none';
            }

            qData.choices.forEach((choice, optIdx) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'option-btn';
                btn.disabled = isAnswered;
                btn.setAttribute('aria-pressed', String(isAnswered && choice === savedAnswer));
                const letter = String.fromCharCode(65 + optIdx);
                btn.setAttribute('aria-label', `${letter}. ${choice.text}${isAnswered ? choice.isCorrect ? '. Correct answer' : choice === savedAnswer ? '. Your incorrect answer' : '' : ''}`);
                
                if (isAnswered) {
                    if (choice.isCorrect) {
                        btn.classList.add('correct');
                        btn.classList.add('answer-reveal');
                    } else if (choice === savedAnswer) {
                        btn.classList.add('incorrect');
                        btn.classList.add('answer-reveal');
                    }
                }

                btn.onclick = () => selectOption(optIdx);
                const letterBadge = document.createElement('span');
                letterBadge.className = 'option-letter';
                letterBadge.textContent = isAnswered && choice.isCorrect ? '✓' : isAnswered && choice === savedAnswer ? '×' : letter;
                letterBadge.setAttribute('aria-hidden', 'true');
                const optionText = document.createElement('span');
                optionText.textContent = choice.text;
                btn.append(letterBadge, optionText);
                optionsContainer.appendChild(btn);
            });

            // Nav buttons
            document.getElementById('prev-btn').disabled = (qIdx === 0 && modIdx === 0);
            document.getElementById('next-btn').innerText = (modIdx === quizData.length - 1 && qIdx === quizData[modIdx].questions.length - 1) ? 'Finish' : 'Next';
            animateQuestion(transition);
        }

        function selectOption(optIdx) {
            const qData = quizData[currentModule].questions[currentQuestion];
            if (userAnswers.has(qData)) return;
            userAnswers.set(qData, qData.choices[optIdx]);

            renderModulesList();
            loadQuestion(currentModule, currentQuestion, 'answer');
        }

        function toggleFlag() {
            const qData = quizData[currentModule].questions[currentQuestion];
            const isChecked = document.getElementById('flag-checkbox').checked;
            if (isChecked) {
                flaggedQuestions.add(qData);
            } else {
                flaggedQuestions.delete(qData);
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion(currentModule, currentQuestion, 'previous');
            } else if (currentModule > 0) {
                const previousModule = currentModule - 1;
                enterModule(previousModule, quizData[previousModule].questions.length - 1, 'previous');
            }
        }

        function nextQuestion() {
            if (currentQuestion < quizData[currentModule].questions.length - 1) {
                currentQuestion++;
                loadQuestion(currentModule, currentQuestion, 'next');
            } else if (currentModule < quizData.length - 1) {
                enterModule(currentModule + 1, 0, 'next');
            } else {
                alert("Congratulations! You have completed the comprehensive 300-question DLD circuit exam!");
            }
        }

        window.onload = init;
    </script>
